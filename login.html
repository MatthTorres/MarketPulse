<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MarketPulse — Iniciar sesión</title>
  <link rel="stylesheet" href="css/style.css?v=12" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <span class="logo-dot"></span>
        <span class="logo-text">MarketPulse</span>
      </div>
      <h1 class="auth-title" id="authTitle">Iniciar sesión</h1>
      <p class="auth-subtitle" id="authSubtitle">Accede a tu cuenta para guardar tus análisis y suscribirte a Premium.</p>
      <div class="auth-tabs">
        <button class="auth-tab active" data-mode="login" id="tabLogin">Iniciar sesión</button>
        <button class="auth-tab" data-mode="register" id="tabRegister">Crear cuenta</button>
      </div>
      <form id="authForm" class="auth-form">
        <div class="form-group" id="nameGroup" style="display:none;">
          <label for="fullName">Nombre completo</label>
          <input type="text" id="fullName" placeholder="Tu nombre" />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="tu@email.com" required />
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="••••••••" required minlength="6" />
            <button type="button" class="password-toggle" id="passwordToggle" aria-label="Mostrar contraseña">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <div class="password-strength" id="passwordStrength"></div>
        </div>
        <button type="submit" class="btn btn-primary auth-submit" id="authSubmit">Iniciar sesión</button>
      </form>
      <div class="auth-divider"><span>o continúa con</span></div>
      <button class="btn btn-google" id="googleBtn">Continuar con Google</button>
      <p class="auth-footer"><a href="index.html">← Volver al inicio</a></p>
      <div id="authMessage" class="auth-message"></div>
    </div>
  </main>
  <script>
    let authMode = 'login';
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const nameGroup = document.getElementById('nameGroup');
    const authTitle = document.getElementById('authTitle');
    const authSubtitle = document.getElementById('authSubtitle');
    const authSubmit = document.getElementById('authSubmit');
    const authForm = document.getElementById('authForm');
    const authMessage = document.getElementById('authMessage');

    function setMode(mode) {
      authMode = mode;
      if (mode === 'login') {
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
        nameGroup.style.display = 'none';
        authTitle.textContent = 'Iniciar sesión';
        authSubtitle.textContent = 'Accede a tu cuenta para guardar tus análisis y suscribirte a Premium.';
        authSubmit.textContent = 'Iniciar sesión';
      } else {
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
        nameGroup.style.display = 'block';
        authTitle.textContent = 'Crear cuenta';
        authSubtitle.textContent = 'Regístrate gratis y accede a análisis personalizados.';
        authSubmit.textContent = 'Crear cuenta';
      }
    }

    tabLogin.addEventListener('click', () => setMode('login'));
    tabRegister.addEventListener('click', () => setMode('register'));

    // Toggle de visibilidad de contraseña
    const passwordToggle = document.getElementById('passwordToggle');
    const passwordInput = document.getElementById('password');
    passwordToggle.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      passwordToggle.innerHTML = isPassword
        ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
        : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
    });

    // Indicador de fortaleza de contraseña
    passwordInput.addEventListener('input', () => {
      const val = passwordInput.value;
      const strengthEl = document.getElementById('passwordStrength');
      if (!val) { strengthEl.textContent = ''; strengthEl.className = 'password-strength'; return; }
      let score = 0;
      if (val.length >= 6) score++;
      if (val.length >= 10) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;
      const levels = [
        { text: 'Muy débil', cls: 'weak' },
        { text: 'Débil', cls: 'weak' },
        { text: 'Regular', cls: 'medium' },
        { text: 'Fuerte', cls: 'strong' },
        { text: 'Muy fuerte', cls: 'strong' },
      ];
      const level = levels[Math.min(score, 4)];
      strengthEl.textContent = level.text;
      strengthEl.className = 'password-strength ' + level.cls;
    });
    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const fullName = document.getElementById('fullName').value;
      authSubmit.disabled = true;
      authSubmit.textContent = 'Procesando…';
      authMessage.textContent = '';
      authMessage.className = 'auth-message';
      try {
        if (authMode === 'login') {
          await MarketPulseAuth.signIn(email, password);
          authMessage.textContent = '¡Bienvenido! Redirigiendo…';
          authMessage.className = 'auth-message success';
          setTimeout(() => window.location.href = 'profile.html', 1000);
        } else {
          await MarketPulseAuth.signUp(email, password, fullName);
          authMessage.textContent = 'Cuenta creada. Revisa tu email para confirmar.';
          authMessage.className = 'auth-message success';
        }
      } catch (err) {
        authMessage.textContent = err.message || 'Error al procesar la solicitud.';
        authMessage.className = 'auth-message error';
      } finally {
        authSubmit.disabled = false;
        authSubmit.textContent = authMode === 'login' ? 'Iniciar sesión' : 'Crear cuenta';
      }
    });

    document.getElementById('googleBtn').addEventListener('click', async () => {
      const btn = document.getElementById('googleBtn');
      btn.disabled = true;
      btn.textContent = 'Redirigiendo…';
      try {
        await MarketPulseAuth.signInWithGoogle();
      } catch (err) {
        console.error('Google OAuth error:', err);
        authMessage.textContent = err.message || 'Error con Google. Verifica que Google OAuth esté habilitado en Supabase.';
        authMessage.className = 'auth-message error';
        btn.disabled = false;
        btn.textContent = 'Continuar con Google';
      }
    });

    MarketPulseAuth.getSession().then(session => {
      if (session) window.location.href = 'profile.html';
    });
  </script>
</body>
</html>
