<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MarketPulse — Noticias</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo-dot"></span><span class="logo-text">MarketPulse</span></div>
    <nav class="nav-links">
      <a href="index.html">Inicio</a>
      <a href="analysis.html">Análisis</a>
      <a href="news.html" class="active">Noticias</a>
      <a href="pricing.html">Planes</a>
    </nav>
  </header>
  <main class="news-hub-page">
    <div id="newsListView">
      <section class="news-hub-hero">
        <h1>📰 Noticias del Mercado</h1>
        <p>Noticias relevantes con análisis de impacto en cripto, metales y divisas.</p>
      </section>
      <section class="news-hub-section">
        <h2 class="news-hub-section-title" id="newsTodayTitle">🔴 Hoy</h2>
        <div class="news-hub-grid" id="newsTodayGrid"></div>
      </section>
      <section class="news-hub-section">
        <h2 class="news-hub-section-title" id="newsWeekTitle">🟡 Esta semana</h2>
        <div class="news-hub-grid" id="newsWeekGrid"></div>
      </section>
      <section class="news-hub-section">
        <h2 class="news-hub-section-title" id="newsMonthTitle">⚪ Este mes</h2>
        <div class="news-hub-grid" id="newsMonthGrid"></div>
      </section>
    </div>
    <div id="newsDetailView" style="display:none;">
  <script>
    const NEWS_DB = [
      { id: 'n1', date: '2026-03-11', title: 'CPI de EE.UU. supera expectativas: inflación sube al 3.2%', source: 'Reuters', category: 'macro',
        summary: 'El CPI muestra una subida del 3.2% interanual, por encima del 2.9% esperado. La Fed podría mantener las tasas altas por más tiempo.',
        impacts: [
          { asset: 'Bitcoin', symbol: 'BTC', type: 'Cripto', direction: 'bearish', reason: 'Inflación alta reduce expectativas de recortes de tasas.' },
          { asset: 'Oro', symbol: 'XAU', type: 'Metal', direction: 'bullish', reason: 'El oro se beneficia como refugio ante incertidumbre.' },
          { asset: 'EUR/USD', symbol: 'EURUSD', type: 'Forex', direction: 'bearish', reason: 'Dólar fuerte por tasas altas presiona EUR/USD.' },
        ] },
      { id: 'n2', date: '2026-03-12', title: 'BCE mantiene tipos de interés sin cambios en 3.75%', source: 'Bloomberg', category: 'forex',
        summary: 'El BCE mantiene sus tipos de referencia, señalizando cautela ante la desaceleración de la zona euro.',
        impacts: [
          { asset: 'EUR/USD', symbol: 'EURUSD', type: 'Forex', direction: 'bearish', reason: 'Sin cambios en tasas presiona al euro.' },
          { asset: 'Bitcoin', symbol: 'BTC', type: 'Cripto', direction: 'neutral', reason: 'El mercado cripto está enfocado en EE.UU.' },
        ] },
      { id: 'n3', date: '2026-03-13', title: 'Bitcoin supera los $85,000 por entrada institucional récord', source: 'CoinDesk', category: 'crypto',
        summary: 'Bitcoin rompe los $85,000 impulsado por entradas récord de ETFs. BlackRock y Fidelity acumulan $2,500 millones en una semana.',
        impacts: [
          { asset: 'Bitcoin', symbol: 'BTC', type: 'Cripto', direction: 'bullish', reason: 'Flujos institucionales masivos impulsan el precio.' },
          { asset: 'Ethereum', symbol: 'ETH', type: 'Cripto', direction: 'bullish', reason: 'Sentimiento positivo se extiende a ETH.' },
          { asset: 'Solana', symbol: 'SOL', type: 'Cripto', direction: 'bullish', reason: 'Altcoins se benefician del rally de BTC.' },
        ] },
    ];
      <a href="news.html" class="news-back-link" id="backToList">← Todas las noticias</a>
      <div class="news-detail-card" id="newsDetailCard"></div>
    </div>
  </main>

    const dirLabels = { bullish: 'Alcista ↑', bearish: 'Bajista ↓', neutral: 'Neutro →' };
    const dirIcons = { bullish: '🟢', bearish: '🔴', neutral: '🟡' };
    const params = new URLSearchParams(location.search);
    const newsId = params.get('id');

    function showList() {
      document.getElementById('newsListView').style.display = 'block';
      document.getElementById('newsDetailView').style.display = 'none';
      const todayStr = new Date().toISOString().split('T')[0];
      const weekAgo = new Date(Date.now() - 7 * 86400000).toISOString().split('T')[0];
      renderGrid('newsTodayGrid', NEWS_DB.filter(n => n.date === todayStr), 'newsTodayTitle');
      renderGrid('newsWeekGrid', NEWS_DB.filter(n => n.date >= weekAgo && n.date < todayStr), 'newsWeekTitle');
      renderGrid('newsMonthGrid', NEWS_DB.filter(n => n.date < weekAgo), 'newsMonthTitle');
    }

    function renderGrid(gridId, items, titleId) {
      const grid = document.getElementById(gridId);
      const title = document.getElementById(titleId);
      if (!grid) return;
      if (!items.length) { grid.innerHTML = '<p class="news-hub-empty">Sin noticias en este período.</p>'; if (title) title.style.display = 'none'; return; }
      if (title) title.style.display = 'block';
      grid.innerHTML = items.map(n => {
        const ds = new Date(n.date + 'T00:00:00').toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' });
        return `<div class="news-hub-card" onclick="window.location.href='news.html?id=${n.id}'">
          <div class="news-hub-card-header">
            <span class="news-hub-card-date">${ds}</span>
            <span class="news-hub-card-category ${n.category}">${n.category}</span>
          </div>
          <h3 class="news-hub-card-title">${n.title}</h3>
          <p class="news-hub-card-summary">${n.summary.substring(0, 120)}…</p>

    function showDetail(id) {
      const news = NEWS_DB.find(n => n.id === id) || NEWS_DB[0];
      document.getElementById('newsListView').style.display = 'none';
      document.getElementById('newsDetailView').style.display = 'block';
      const ds = new Date(news.date + 'T00:00:00').toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      document.getElementById('newsDetailCard').innerHTML = `
        <div class="news-detail-header">
          <span class="news-detail-category ${news.category}">${news.category.toUpperCase()}</span>
          <h1>${news.title}</h1>
          <div class="news-detail-meta">
            <span class="news-detail-date">📅 ${ds}</span>
            <span class="news-detail-source">📰 ${news.source}</span>
          </div>
        </div>
        <div class="news-detail-body"><p class="news-detail-summary">${news.summary}</p></div>
        <div class="news-impact-section">
          <h2>📊 Análisis de Impacto en Activos</h2>
          <p class="impact-intro">Cómo esta noticia afecta a los activos listados en MarketPulse:</p>
          <div class="impact-grid">
            ${news.impacts.map(i => `
              <div class="impact-card ${i.direction}">
                <div class="impact-card-header">
                  <span class="impact-asset">${i.asset}</span>
                  <span class="impact-symbol">${i.symbol}</span>
                  <span class="impact-direction ${i.direction}">${dirIcons[i.direction]} ${dirLabels[i.direction]}</span>
                </div>
                <div class="impact-card-type">${i.type}</div>
                <p class="impact-reason">${i.reason}</p>
              </div>
            `).join('')}
          </div>
        </div>
        <div class="news-detail-footer">
          <a href="analysis.html?coin=bitcoin" class="btn btn-primary">Ver Análisis Completo</a>
          <a href="news.html" class="btn btn-secondary">Todas las noticias</a>
        </div>`;
    }

    if (newsId) { showDetail(newsId); } else { showList(); }
  </script>
</body>
</html>
          <div class="news-hub-card-impacts">${n.impacts.slice(0, 3).map(i => `<span class="news-hub-impact-tag ${i.direction}">${dirIcons[i.direction]} ${i.asset}</span>`).join('')}</div>
        </div>`;
      }).join('');
    }
